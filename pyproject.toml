[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "esg-forecasting"
version = "0.1.0"
description = "Benchmark of statistical, deep-learning and foundation-model forecasts of ESG score series"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.11",
  "scikit-learn>=1.3",
  "statsmodels>=0.14",
  "matplotlib>=3.7",
  "openpyxl>=3.1",
]

[project.optional-dependencies]
deep = ["tensorflow>=2.15"]
chronos = ["torch>=2.0", "transformers>=4.48,<5", "accelerate>=0.32", "chronos-forecasting>=1.5.2"]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
